# Pass memory protection down to app.slice so dictation.service can claim it.
#
# cgroup v2 memory.min is capped by the parent at every level, so a setting on
# dictation.service alone is inert: app.slice sits at 0 by default, which makes
# the leaf's effective protection 0 no matter what it asks for.
#
# Only children that request protection receive a share, and dictation.service
# is normally the sole requester -- browsers and other apps in this slice ask
# for nothing, so they neither gain nor lose. This reserves, it does not limit.
[Slice]
MemoryMin=@MEM_MIN@
