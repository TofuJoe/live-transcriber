# Keep the daemon's pages resident so the iGPU can pin them.
#
# The iGPU has no VRAM: OpenVINO's buffers are system RAM the kernel must pin
# into the GPU's address space. When those pages have been reclaimed under
# memory pressure the bind fails with -12 (ENOMEM), the xe driver bans the GPU
# VM, and transcription on that worker dies. See docs/findings.md.
#
# MemoryMin is hard protection: these pages are never reclaimed.
#
# Inert on its own -- cgroup v2 caps memory.min at every ancestor, so this also
# needs the matching raise in app.slice.d/ and /etc/uresourced.conf. install.sh
# sets all three.
#
# MemoryLow is best-effort and currently has no effect: uresourced pins
# memory.low to 0 up the chain, so nothing propagates down. Left as a statement
# of intent in case that ceiling is ever raised; MemoryMin does the real work.
[Service]
MemoryMin=@MEM_MIN@
MemoryLow=@MEM_LOW@
